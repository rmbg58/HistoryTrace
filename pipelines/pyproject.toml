[project]
name = "ht"
version = "0.1.0"
description = "HistoryTrace 数据管线:import / verify / build / report / era"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ht = "ht.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ht"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
